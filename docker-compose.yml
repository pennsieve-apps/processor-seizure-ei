services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - dev.env
    mem_limit: 2g
    volumes:
      # the `ieeg` input in its subfolder, as a linked workflow places it
      - ./data/fixture/linked:/data/input:ro
      - ./data/output:/data/output
